<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moreno's Dog Training</title>
<meta name="description" content="Reserva daycare, entrenamiento y clases para tu perro, y paga desde tu teléfono.">
<meta name="theme-color" content="#0F2528">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moreno's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F2528; --bg2:#0B1B1E; --teal:#1F5C63; --teal2:#2A6A72;
  --ink:#F4EEE9; --muted:#A9C2C3; --soft:#D6E3E4;
  --orange:#F08455; --peach:#FFB08F; --gold:#FFD76A; --dark:#17191A;
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.14);
  --cream:#F4EEE9; --creamInk:#4F676B;
  --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;background:
  radial-gradient(420px 380px at 100% 45%,rgba(222,106,62,.16),transparent 70%),
  radial-gradient(420px 420px at 0% 85%,rgba(48,128,140,.24),transparent 70%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--peach)}
.d{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;line-height:1.05}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(120px + var(--safeB))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--orange);text-transform:uppercase}
.hero{position:relative;overflow:hidden;border-radius:0 0 36px 36px;border-bottom:1px solid rgba(255,255,255,.13);
  padding:calc(30px + var(--safeT)) 22px 28px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(60% 70% at 82% 35%,rgba(222,106,62,.5),transparent 70%),linear-gradient(160deg,#1E4247 0%,#122D31 55%,#0B1B1E 100%)}
.hero.tall{padding-bottom:72px}
.paw{position:absolute;fill:#DE6A3E;pointer-events:none}
.hero h1{margin:0;font-size:38px;color:#fff}
.hero h1 em{font-style:normal;color:var(--peach)}
.hero p{margin:0;color:var(--soft);font-size:15px;font-weight:500}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative}
.brand{font-family:"Baloo 2";font-weight:800;font-size:15px;letter-spacing:.06em;background:var(--orange);color:var(--dark);padding:2px 12px;border-radius:20px}
.avatar{width:52px;height:52px;border-radius:26px;background:var(--teal);border:2px solid var(--peach);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--ink);padding:0;text-decoration:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.sec{padding:24px 18px 0;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:24px}
.ticket{margin:-50px 18px 0;position:relative;background:var(--cream);color:var(--dark);border-radius:26px;box-shadow:0 16px 36px rgba(0,0,0,.45)}
.ticket .top{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ticket .lbl{font-size:12px;font-weight:800;letter-spacing:.16em;color:#B04A22}
.ticket .ttl{font-size:23px;margin:2px 0}
.ticket .sub{font-size:14px;color:var(--creamInk)}
.ticket .cut{border-top:2px dashed #D8CBC2;margin:0 16px}
.ticket .acts{display:flex;gap:8px;padding:14px 16px 16px}
.count{flex-shrink:0;width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#1E4247,#0F2528);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(4deg);color:#fff}
.count small{font-size:11px;font-weight:700;color:var(--muted)}
.count b{font-family:"Baloo 2";font-size:26px;line-height:.9;color:var(--peach)}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:0;padding:0 18px;font-weight:800;font-size:15px;text-decoration:none;background:var(--orange);color:var(--dark)}
.btn.dark{background:var(--bg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.3)}
.btn.teal{background:var(--teal);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.wa{background:#1F8A5B;color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:120px;border-radius:22px;padding:16px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;border:1px solid transparent}
.tile b{font-family:"Baloo 2";font-weight:800;font-size:20px;line-height:1.1;display:block}
.tile span{font-size:13px}
.t-teal{background:linear-gradient(160deg,#2A6A72,#1F5C63);color:#fff;border-color:rgba(255,255,255,.16)}
.t-teal span{color:var(--soft)}
.t-orange{background:var(--orange);color:var(--dark)} .t-orange span{color:#3A2016}
.t-glass{background:var(--glass);color:var(--ink);border-color:rgba(255,255,255,.16)} .t-glass span{color:var(--muted)}
.t-gold{background:var(--gold);color:var(--dark)} .t-gold span{color:#4A3A10}
.sticker{position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--dark);font-size:12px;font-weight:800;padding:4px 10px;border-radius:12px;transform:rotate(6deg);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:16px;color:var(--ink);text-decoration:none}
.row{display:flex;align-items:center;gap:14px}
.muted{color:var(--muted)}
.plus{position:relative;overflow:hidden;background:var(--orange);border:2px solid var(--gold);border-radius:24px;padding:18px;text-decoration:none;color:var(--dark);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 16px 36px rgba(222,106,62,.3)}
.plus .bigword{position:absolute;right:-10px;bottom:-26px;font-family:"Baloo 2";font-weight:800;font-size:96px;line-height:1;color:#F59A72}
.plus .tag{position:relative;background:var(--bg);color:var(--gold);font-weight:800;font-size:16px;padding:8px 12px;border-radius:14px}
/* Reservar */
.tabs{position:relative;display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.13);padding:5px;border-radius:18px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:14px;font-size:13px;font-weight:800;background:transparent;color:var(--soft);padding:0 4px}
.tabs button[aria-pressed="true"]{background:var(--orange);color:var(--dark)}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left}
.opt[aria-pressed="true"]{background:rgba(240,132,85,.12);border:2px solid var(--orange);padding:15px;box-shadow:0 10px 28px rgba(222,106,62,.25)}
.opt b{font-family:"Baloo 2";font-weight:800;font-size:19px;line-height:1.15;display:block}
.opt small{font-size:13px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
.price{flex-shrink:0;font-family:"Baloo 2";font-weight:800;font-size:20px;padding:4px 12px;border-radius:14px;color:var(--peach);background:rgba(255,255,255,.08)}
.opt[aria-pressed="true"] .price{background:var(--orange);color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:800;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--dark)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex-shrink:0;width:58px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--ink)}
.day small{font-size:11px;font-weight:800;letter-spacing:.06em}
.day b{font-family:"Baloo 2";font-size:24px;line-height:1}
.day[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--dark)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.paybar{position:fixed;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));bottom:calc(96px + var(--safeB));background:var(--cream);color:var(--dark);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;z-index:20}
.paybar small{font-size:12px;color:var(--creamInk);font-weight:600;display:block}
.paybar b{font-family:"Baloo 2";font-size:28px;font-weight:800;line-height:1}
.paybar .btn{flex-grow:1}
/* Mi perro */
.dogpic{position:relative;flex-shrink:0;width:104px;height:104px;border-radius:52px;background:rgba(255,255,255,.08);border:3px solid var(--orange);box-shadow:0 0 0 6px rgba(240,132,85,.18);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;color:var(--muted);padding:0}
.dogpic img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px}
.p-gold{background:var(--gold);color:var(--dark)} .p-orange{background:var(--orange);color:var(--dark)} .p-red{background:#FFB3A8;color:#5A1209} .p-glass{background:rgba(255,255,255,.1);color:var(--soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--soft)}
.field input{min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);padding:0 14px;font-size:16px}
.field input:focus{outline:2px solid var(--orange);outline-offset:1px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.res:last-child{border-bottom:0}
.cmd{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,#2A6A72,#1F5C63);border:1px solid rgba(255,255,255,.16)}
.cmd b{font-family:"Baloo 2";font-weight:800;font-size:18px;line-height:1.05}
.cmd span{font-size:12px;color:var(--soft)}
/* Daycare */
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stat small{font-size:11px;font-weight:700;color:var(--muted)}
.stat b{font-family:"Baloo 2";font-weight:800;font-size:18px;color:var(--peach)}
.rule{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rule:last-child{border-bottom:0}
.rule .ic{flex-shrink:0;width:36px;height:36px;border-radius:12px;background:rgba(240,132,85,.16);display:flex;align-items:center;justify-content:center;color:var(--peach)}
.rule b{display:block;font-size:15px}
.rule span{font-size:13px;color:var(--muted);line-height:1.45}
.polaroid{background:var(--cream);color:var(--dark);border-radius:8px;padding:10px 10px 14px;box-shadow:0 16px 34px rgba(0,0,0,.5);transform:rotate(-1.5deg)}
.polaroid .ph{height:150px;border-radius:4px;background:#CFE3E5;display:flex;align-items:center;justify-content:center;color:var(--teal)}
/* Membresía */
.tier{border-radius:28px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.tier.top{background:linear-gradient(150deg,#F59468,#F08455);color:var(--dark);border:2px solid var(--gold);box-shadow:0 18px 44px rgba(222,106,62,.35)}
.tier.basic{background:var(--glass);border:1px solid var(--line)}
.tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:600}
.tier li{display:flex;gap:10px;align-items:center}
/* Nav */
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));bottom:calc(22px + var(--safeB));display:flex;gap:2px;background:rgba(8,22,25,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:30px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:30}
nav.tabbar a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:22px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:800}
nav.tabbar a span{display:none}
nav.tabbar a[aria-current="page"]{flex:1.6;background:var(--orange);color:var(--dark)}
nav.tabbar a[aria-current="page"] span{display:inline}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#163236,#0F2528);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + var(--safeB));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.7,.2,1)}
.sheet h3{margin:0;font-size:26px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex-shrink:0;width:30px;height:30px;border-radius:15px;background:var(--orange);color:var(--dark);font-weight:800;display:flex;align-items:center;justify-content:center}
.sum{background:rgba(0,0,0,.25);border-radius:18px;padding:14px;font-size:14px;line-height:1.7}
.sum b{color:var(--peach)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + var(--safeT));background:var(--cream);color:var(--dark);font-weight:700;padding:12px 18px;border-radius:16px;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.4)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view,.sheet{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- v2: cuentas, panel ---- */
.field select,.field textarea{min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);padding:10px 14px;font-size:16px;color:var(--ink)}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field select:focus,.field textarea:focus{outline:2px solid var(--orange);outline-offset:1px}
.field select option{background:#0F2528}
.linkbtn{background:none;border:0;color:var(--peach);font-weight:700;font-size:14px;padding:8px 0;min-height:40px;text-align:left}
.err{background:#5A1209;color:#FFD9D2;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.okmsg{background:rgba(31,138,91,.25);color:#C9F2DC;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.feed{display:flex;flex-direction:column;gap:22px}
.polaroid img,.polaroid video{width:100%;max-height:420px;object-fit:cover;border-radius:4px;display:block;background:#CFE3E5}
.polaroid.r{transform:rotate(1.2deg)}
.polaroid .meta{padding:10px 4px 0}
.polaroid .meta small{font-size:12px;font-weight:800;color:#1F5C63;text-transform:uppercase}
.polaroid .meta p{margin:2px 0 0;font-size:15px;line-height:1.45}
.cmd.dom{background:linear-gradient(160deg,#2A6A72,#1F5C63)}
.cmd.pra{background:rgba(240,132,85,.14);border:2px solid var(--orange)}
.cmd.pen{background:transparent;border:2px dashed rgba(255,255,255,.2);color:var(--muted)}
.cmd .st{align-self:flex-start;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px}
.cmd.dom .st{background:var(--gold);color:var(--dark)} .cmd.pra .st{background:var(--orange);color:var(--dark)} .cmd.pen .st{background:rgba(255,255,255,.1);color:var(--soft)}
button.cmd{text-align:left;color:var(--ink);font:inherit;min-height:84px}
.bubble{display:flex;gap:10px;align-items:flex-end}
.bubble .who{flex-shrink:0;width:40px;height:40px;border-radius:20px;background:var(--orange);color:var(--dark);display:flex;align-items:center;justify-content:center;font-family:"Baloo 2";font-weight:800}
.bubble .txt{background:var(--cream);color:var(--dark);border-radius:22px 22px 22px 6px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bubble .txt small{font-size:12px;font-weight:700;color:var(--creamInk)}
.bubble .txt span{font-size:15px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.adm{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.adm .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.adm .acts{display:flex;flex-wrap:wrap;gap:8px}
.adm .acts .btn{min-height:42px;padding:0 14px;font-size:14px;border-radius:14px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid .stat b{font-size:26px}
.p-green{background:#BFF0D4;color:#0E3D25}
.p-gray{background:rgba(255,255,255,.08);color:var(--muted)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;line-height:1.5}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--orange);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.dogchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;position:relative}
.dogchips::-webkit-scrollbar{display:none}
.dogchips .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 6px}
.dogchips .chip i{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.1) center/cover;display:inline-block;flex-shrink:0}
/* ---- v3: oferta, ficha, avisos ---- */
.oferta{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;border-radius:26px;padding:20px 18px 18px;text-decoration:none;color:var(--dark);text-align:left;width:100%;border:2px solid var(--gold);
  background:radial-gradient(120% 90% at 100% 0%,#FFD76A 0%,rgba(255,215,106,0) 55%),linear-gradient(150deg,#F59468,#DE6A3E);box-shadow:0 18px 40px rgba(222,106,62,.38)}
.oferta .ribbon{align-self:flex-start;background:var(--dark);color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;padding:5px 10px;border-radius:10px;text-transform:uppercase}
.oferta h3{margin:0;font-size:30px;line-height:1}
.oferta .pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oferta .pr b{font-family:"Baloo 2";font-size:46px;line-height:.9}
.oferta .pr s{font-size:18px;font-weight:700;color:#5A2A14}
.oferta p{margin:0;font-size:14px;font-weight:600;color:#3A2016;line-height:1.45}
.oferta .go{min-height:50px;border-radius:16px;background:var(--dark);color:var(--gold);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.oferta .big{position:absolute;right:-8px;top:-18px;font-family:"Baloo 2";font-weight:800;font-size:110px;line-height:1;color:rgba(255,255,255,.14);pointer-events:none}
.was{text-decoration:line-through;color:var(--muted);font-size:14px;margin-right:4px}
.fs{display:flex;flex-direction:column;gap:12px;border:0;margin:0;padding:0}
.fs legend{font-family:"Baloo 2";font-weight:800;font-size:19px;color:var(--peach);padding:0;margin-bottom:2px}
.fs + .fs{border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
.vacrow{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.vacrow b{font-size:14px}
.vacrow .req{font-size:11px;font-weight:800;color:var(--gold);margin-left:6px}
.vacrow .field label{font-size:12px}
.vacrow .field input{min-height:44px;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}

async function loadAll() {
  if (!sb || !A.user) { Object.assign(A, { profile: null, admin: false, dogs: [], bookings: [], progress: {}, notes: [], updates: [], reports: {}, contracts: [] }); return; }
  const uid = A.user.id;
  const [p, ad, d, b, gen, ct] = await Promise.all([
    sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
    sb.rpc("is_admin"),
    sb.from("dogs").select("*").eq("owner_id", uid).order("created_at"),
    sb.from("bookings").select("*").eq("owner_id", uid).order("created_at", { ascending: false }),
    sb.from("updates").select("*").is("dog_id", null).order("created_at", { ascending: false }).limit(20),
    sb.from("contracts").select("id,titulo,total,plan,created_at,dog_id").eq("owner_id", uid).order("created_at", { ascending: false }).limit(50)
  ]);
  A.contracts = ct.data || [];
  A.profile = p.data || { id: uid, nombre: "", telefono: "" };
  A.admin = ad.data === true;
  A.dogs = d.data || [];
  A.bookings = b.data || [];
  const ids = A.dogs.map((x) => x.id);
  let updates = gen.data || [];
  A.progress = {}; A.notes = []; A.reports = {};
  if (ids.length) {
    const [pr, n, u, r] = await Promise.all([
      sb.from("dog_progress").select("*").in("dog_id", ids),
      sb.from("notes").select("*").in("dog_id", ids).order("created_at", { ascending: false }).limit(60),
      sb.from("updates").select("*").in("dog_id", ids).order("created_at", { ascending: false }).limit(60),
      sb.from("day_reports").select("*").in("dog_id", ids).eq("fecha", today())
    ]);
    (pr.data || []).forEach((x) => (A.progress[x.dog_id] = x.comandos || {}));
    A.notes = n.data || [];
    updates = updates.concat(u.data || []);
    (r.data || []).forEach((x) => (A.reports[x.dog_id] = x));
  }
  A.updates = updates.sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
}

    sb.from("dog_progress").select("*").eq("dog_id", id).maybeSingle(),

    sb.from("day_reports").select("*").eq("dog_id", id).eq("fecha", today()).maybeSingle(),
    sb.from("contracts").select("id,titulo,total,plan,created_at").eq("dog_id", id).order("created_at", { ascending: false }).limit(20)

async function refresh() {

    } while (again);

  })();

}

/* ---- Ficha completa del perro ---- */
const VF = { dogId: null, fotos: [], urls: {} };
const mesesDe = (n) => { if (!n) return null; const d = parse(n), t = new Date(); let m = (t.getFullYear() - d.getFullYear()) * 12 + t.getMonth() - d.getMonth(); if (t.getDate() < d.getDate()) m--; return m; };
function edadDe(n) { const m = mesesDe(n); if (m == null || m < 0) return ""; if (m < 12) return m + (m === 1 ? " mes" : " meses"); const y = Math.floor(m / 12); return y + (y === 1 ? " año" : " años"); }
function fichaFaltan(d, p) {
  const f = [], vac = d.vac || {}, fotos = (d.vac_fotos || []).length;
  if (!d.nombre) f.push("nombre");
  if (!d.sexo) f.push("sexo");
  if (!d.castrado) f.push("si está esterilizado");
  if (!d.nacimiento && !d.edad) f.push("fecha de nacimiento o edad");
  const sinFecha = VACS.filter((v) => v[2] && !(vac[v[0]] && vac[v[0]].vence));
  if (sinFecha.length && !fotos) f.push("vacunas: pon las fechas o sube fotos del récord");
  VACS.filter((v) => v[2] && vac[v[0]] && vac[v[0]].vence && daysUntil(vac[v[0]].vence) < 0).forEach((v) => f.push("la vacuna de " + v[1] + " está vencida"));
  if (!d.vac_certifica) f.push("certificar que sus vacunas están al día");
  if (!d.conducta || !d.conducta.mordido) f.push("si ha mordido");
  if (!p || !p.emergencia_nombre || !p.emergencia_tel) f.push("contacto de emergencia");
  return f;
}
const sel = (name, opts, v, id) => `<select id="${id}" name="${name}"><option value="">Escoge…</option>${opts.map((o) => `<option ${v === o ? "selected" : ""}>${o}</option>`).join("")}</select>`;
function thumbsHtml() {
  return VF.fotos.map((pth) => { const u = VF.urls[pth], pdf = /\.pdf$/i.test(pth); return `<span>${u && !pdf ? `<img src="${esc(u)}" alt="Récord de vacunas">` : pdf ? "PDF" : "Foto"}<button type="button" data-vacdel="${esc(pth)}" aria-label="Quitar">✕</button></span>`; }).join("") || '<span style="width:auto;padding:0 12px;border-style:dashed">Sin fotos todavía</span>';
}

async function signedUrls(paths) {
  const out = {};
  if (!sb || !paths || !paths.length) return out;
  try { const { data } = await sb.storage.from("records").createSignedUrls(paths, 3600); (data || []).forEach((x) => { if (x.signedUrl) out[x.path] = x.signedUrl; }); } catch (e) {}
  return out;
}

/* ---- Notificaciones ---- */
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let PUSH_ON = false;
async function pushCheck() {
  if (!pushOK() || !A.user || Notification.permission !== "granted") { PUSH_ON = false; return; }
  try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); PUSH_ON = !!s; if (s) saveSub(s); } catch (e) { PUSH_ON = false; }
}
function pushCard() {
  if (!A.user || PUSH_ON || PREF.noPush) return "";
  if (!pushOK()) return isIOS && !standalone() ? `<section class="sec"><div class="card"><b>Recibe avisos de tu perro</b><p class="note" style="margin-top:4px">En iPhone, primero instala la app en tu pantalla de inicio y ábrela desde el ícono. Ahí te salen los avisos.</p><button class="linkbtn" data-act="instalar">Cómo instalarla</button></div></section>` : "";
  if (Notification.permission === "denied") return "";
  return `<section class="sec"><div class="card row" style="justify-content:space-between"><div><b>Activa los avisos</b><div class="muted" style="font-size:13px">Te avisamos cuando confirmemos tu cita o haya fotos de tu perro.</div></div><button class="btn" data-act="push">Activar</button></div></section>`;
}
const b64u = (s) => { const p = "=".repeat((4 - (s.length % 4)) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
async function saveSub(sub) { try { await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: A.user.id, sub: sub.toJSON() }, { onConflict: "endpoint" }); } catch (e) {} }
async function enablePush() {
  if (!pushOK()) return installSheet();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { PREF.noPush = true; savePref(); render(true); return toast("Puedes activarlos luego en los ajustes del teléfono"); }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) }));
    const { error } = await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: A.user.id, sub: sub.toJSON() }, { onConflict: "endpoint" });
    if (error) throw error;
    PUSH_ON = true; render(true); toast("¡Avisos activados!");
  } catch (err) { toast("No se pudieron activar los avisos: " + errMsg(err)); }
}
/* Hector le manda un aviso a un cliente (user_id) o a todos (all: true). Si falla, no pasa nada. */
function notify(target, title, body, url) {
  if (!sb || !A.admin || !target) return;
  sb.functions.invoke("notify", { body: Object.assign({ title, body, url: APP_URL + (url || "") }, target) }).catch(() => {});
}

const ROUTES = ["inicio", "reservar", "perro", "daycare", "membresia", "admin", "admin-reservas", "admin-perros", "admin-contratos", "admin-publicar"];
function route() {
  const h = location.hash.replace("#", "");
  if (h.startsWith("admin-perro-")) return { name: "admin-perro", arg: h.slice(12) };
  return { name: ROUTES.includes(h) ? h : "inicio", arg: null };
}
function navHtml(cur) {
  const items = [["inicio", "Inicio", "home"], ["reservar", "Reservar", "cal"], ["perro", "Mi perro", "paw"], ["daycare", "Daycare", "cam"], ["membresia", "Membresía", "star"]];

  const active = cur.startsWith("admin") ? "admin" : cur;
  return items.map((i) => `<a href="#${i[0]}" ${active === i[0] ? 'aria-current="page"' : ""} aria-label="${i[1]}">${ic(i[2], 22)}<span>${i[1]}</span></a>`).join("");

let lastRoute = "";
function render(keep) {
  const r = route(), key = r.name + (r.arg || "");
  const y = window.scrollY;

  $("#view").innerHTML = `<div class="${keep && key === lastRoute ? "" : "view"}">${html}</div>`;
  $("#tabbar").innerHTML = navHtml(r.name);
  if (!(keep && key === lastRoute)) window.scrollTo(0, 0); else window.scrollTo(0, y);
  lastRoute = key;
  const s = $("#dsearch");
  if (s) s.addEventListener("input", () => { const q = s.value.trim().toLowerCase(); document.querySelectorAll("#dlist [data-q]").forEach((a) => (a.style.display = a.dataset.q.includes(q) ? "" : "none")); });
}
let SPECIAL = false;

function errMsg(e) {
  const m = String((e && e.message) || e || "");
  if (/invalid login/i.test(m)) return "Email o contraseña incorrectos.";
  if (/already registered|already exists/i.test(m)) return "Ese email ya tiene cuenta. Entra con tu contraseña.";
  if (/at least 6|password should/i.test(m)) return "La contraseña debe tener por lo menos 6 caracteres.";
  if (/email not confirmed/i.test(m)) return "Confirma tu email primero (revisa tu correo).";
  if (/rate limit|too many/i.test(m)) return "Demasiados intentos. Espera unos minutos y vuelve a intentar.";
  if (/invalid.*email|valid email/i.test(m)) return "Revisa que el email esté bien escrito.";
  if (/fetch|network/i.test(m)) return "No hay conexión. Revisa tu internet.";
  return "Algo salió mal: " + m;
}

/* ---- Fotos ---- */
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob((b) => (b ? res(b) : rej(new Error("No se pudo leer la foto"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer la foto. Prueba con otra.")); };
    img.src = url;
  });
}
async function upload(path, blob, type) {
  const { error } = await sb.storage.from("fotos").upload(path, blob, { contentType: type, upsert: true, cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}
$("#photo").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  const dog = curDog(); if (!file || !dog || !A.user) return;
  toast("Subiendo foto…");
  try {
    const blob = await resizeImage(file, 800);
    const url = await upload(`perros/${A.user.id}/${dog.id}-${Date.now()}.jpg`, blob, "image/jpeg");
    const { error } = await sb.from("dogs").update({ foto_url: url }).eq("id", dog.id); if (error) throw error;
    toast("¡Foto lista!"); await refresh();
  } catch (err) { toast(errMsg(err)); }
});
/* Récord de vacunas: carpeta privada "records" */
$("#vacfile").addEventListener("change", async (e) => {
  const files = [...(e.target.files || [])]; e.target.value = "";
  if (!files.length || !A.user) return;
  if (!VF.dogId) return toast("Guarda la ficha primero y luego sube las fotos.");
  toast(files.length > 1 ? "Subiendo " + files.length + " fotos…" : "Subiendo foto…");
  try {
    for (const [i, file] of files.entries()) {
      const pdf = file.type === "application/pdf";
      if (pdf && file.size > 10 * 1024 * 1024) throw new Error("El PDF es muy grande (máximo 10 MB).");
      const blob = pdf ? file : await resizeImage(file, 1600);
      const path = `${A.user.id}/${VF.dogId}/vacunas-${Date.now()}-${i}.${pdf ? "pdf" : "jpg"}`;
      const { error } = await sb.storage.from("records").upload(path, blob, { contentType: pdf ? "application/pdf" : "image/jpeg", upsert: true });
      if (error) throw error;
      VF.fotos.push(path); VF.urls[path] = URL.createObjectURL(blob);
    }
    const t = $("#vacThumbs"); if (t) t.innerHTML = thumbsHtml();
    toast("¡Listo! Dale Guardar para terminar");
  } catch (err) { toast(errMsg(err)); }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-vacdel]"); if (!b) return;
  VF.fotos = VF.fotos.filter((x) => x !== b.dataset.vacdel);

let pendingMedia = null;
$("#media").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) return toast("El video es muy grande (máximo 50 MB). Grábalo más corto.");
  pendingMedia = file;
  const l = $("#mediaLbl"); if (l) l.textContent = (file.type.startsWith("video") ? "Video: " : "Foto: ") + file.name.slice(0, 28);

async function publishUpdate(dogId, texto) {
  if (!texto && !pendingMedia) throw new Error("Escribe algo o añade una foto o video.");
  let media_url = null, media_tipo = null;
  if (pendingMedia) {
    const isVid = pendingMedia.type.startsWith("video");
    toast(isVid ? "Subiendo video… no cierres la app" : "Subiendo foto…");
    const folder = `updates/${dogId || "todos"}/${Date.now()}`;
    if (isVid) { const ext = (pendingMedia.name.split(".").pop() || "mp4").toLowerCase(); media_url = await upload(`${folder}.${ext}`, pendingMedia, pendingMedia.type || "video/mp4"); media_tipo = "video"; }
    else { media_url = await upload(`${folder}.jpg`, await resizeImage(pendingMedia, 1600), "image/jpeg"); media_tipo = "foto"; }
  }
  const { error } = await sb.from("updates").insert({ dog_id: dogId, texto, media_url, media_tipo });
  if (error) throw error;
  if (dogId) notify({ user_id: ADM.dog && ADM.dog.dog && ADM.dog.dog.owner_id }, media_tipo === "video" ? "Video nuevo de " + ADM.dog.dog.nombre : media_tipo ? "Foto nueva de " + ADM.dog.dog.nombre : "Novedad de " + ADM.dog.dog.nombre, texto || "Mírala en la app", "#daycare");
  else notify({ all: true }, "Moreno's Dog Training", texto || "Hay fotos nuevas en el daycare", "#daycare");
  pendingMedia = null; toast("¡Publicado!");
  if (dogId) { await loadAdminDog(dogId); render(true); } else { const f = $("#upForm"); if (f) f.reset(); const l = $("#mediaLbl"); if (l) l.textContent = "Añadir foto o video"; await loadAll(); }
}

/* ---- Reservar: confirmar ---- */
async function confirmBooking() {
  const o = options()[R.opt];
  if (!isGroup() && !o.noDay && !R.day) return toast("Escoge el día");
  if (needsTime() && !R.time) return toast("Escoge la hora");
  if (!A.user) { toast("Crea tu cuenta para reservar"); return authSheet("signup"); }
  const dog = curDog();
  if (!dog) { toast("Primero añade a tu perro"); return openFicha(null); }
  if (!dog.ficha_ok) { toast("Completa la ficha de " + dog.nombre + " antes de reservar"); return openFicha(dog); }
  const mod = R.tab === "train" ? MODS.find((m) => m[0] === R.mod)[1] : "";
  const titulo = R.tab === "oferta" ? `Oferta Pre-Apertura · ${o.name}` : R.tab === "train" ? `Paquete ${o.name} · ${mod}` : R.tab === "daycare" ? `Daycare · ${o.name}` : o.name;
  const payNow = R.plan === "dep" ? depOf(o) : o.price;
  const methodName = { stripe: "Tarjeta o Klarna (Stripe)", ath: "ATH Móvil", cash: "Efectivo", check: "Cheque" }[R.method];
  // 1) Contrato firmado antes de cualquier pago
  const ct = await firmar({ tipo: o.tipo, titulo, total: o.price, plan: R.plan, deposito: R.plan === "dep" ? depOf(o) : 0, paquete: o.paquete, modalidad: o.modalidad }, dog);
  if (!ct) return toast("Necesitas firmar el contrato para reservar");
  const link0 = R.method === "stripe" && o.pay ? (R.plan === "dep" ? o.pay[1] : o.pay[0]) : "";
  const link = MDTContrato.payUrl(link0, ct);
  const btn = $("#confirm"); if (btn) btn.disabled = true;
  const fecha = isGroup() || o.noDay ? null : R.day;
  const { error } = await sb.from("bookings").insert({ owner_id: A.user.id, dog_id: dog.id, servicio: R.tab, titulo, fecha, hora: R.time || null, total: o.price, pagar_hoy: payNow, metodo: R.method, plan: R.plan, contract_id: ct.id });
  if (btn) btn.disabled = false;
  if (error) return toast(errMsg(error));
  const msg = [
    "Hola Moreno's, acabo de reservar en la app:",
    "Servicio: " + titulo,
    isGroup() ? "Fecha: apúntenme en la lista del próximo grupo" : o.noDay ? "Fecha: por coordinar después de la apertura" : "Día: " + nice(R.day) + (R.time ? " a las " + R.time : ""),
    "Pago: " + methodName + " · " + (R.plan === "dep" ? "Depósito (" + money(payNow) + " de " + money(o.price) + ")" : "Completo (" + money(o.price) + ")"),
    "Cliente: " + ((A.profile && A.profile.nombre) || "-"),
    "Perro: " + dog.nombre + (dog.raza ? " (" + dog.raza + ")" : ""),
    "Contrato firmado núm. " + MDTContrato.numero(ct.id)
  ].join("\n");
  refresh();
  openSheet(`
    <h3 class="d">¡Reserva enviada!</h3>
    <div class="sum"><b>${esc(titulo)}</b> · ${esc(dog.nombre)}<br>${isGroup() ? "Lista del próximo grupo" : o.noDay ? "Comienzo: lo coordinamos contigo al abrir" : nice(R.day) + (R.time ? " · " + esc(R.time) : "")}<br>${R.plan === "dep" ? "Depósito hoy: " + money(payNow) + " de " + money(o.price) : "Total: " + money(o.price)} · ${methodName}<br>Contrato firmado núm. ${MDTContrato.numero(ct.id)}</div>
    <p class="note">Hector la revisa y la confirma. Vas a ver el cambio en <b style="color:var(--ink)">Mi perro</b>.</p>
    <div class="step"><span class="n">1</span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><b>Paga para apartar tu espacio</b>${link ? `<a class="btn block" href="${esc(link)}" target="_blank" rel="noopener">Pagar ${money(payNow)} ahora</a><span class="note">Pagas seguro con Stripe. Klarna te deja pagar en cuotas.</span>` : `<span class="note">Te enviamos las instrucciones de pago por WhatsApp${R.method === "ath" ? " para ATH Móvil" : ""}.</span>`}</div></div>
    <div class="step"><span class="n">2</span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><b>¿Quieres avisarle ya?</b><a class="btn wa block" href="${waLink(msg)}" target="_blank" rel="noopener">${ic("wa", 20)} Avisar por WhatsApp</a></div></div>
    <button class="btn ghost block" data-copy="${ct.id}">Ver mi copia del contrato</button>
    <button class="btn ghost block" data-close>Listo</button>`);
  LAST_CT[ct.id] = ct;
}

/* ---- Contratos ---- */
const LAST_CT = {};
function firmar(o, dog) {
  const p = A.profile || {};
  return MDTContrato.abrir(Object.assign(o, {
    sb, origen: "app", ownerId: A.user ? A.user.id : null, dogId: dog ? dog.id : null,
    cliente: { nombre: p.nombre || "", tel: p.telefono || "", email: (A.user && A.user.email) || "" },
    perro: dog ? dog.nombre + (dog.raza ? " (" + dog.raza + ")" : "") : ""
  }));
}
async function verContrato(id) {
  if (LAST_CT[id]) return MDTContrato.copia(LAST_CT[id]) || toast("Permite ventanas emergentes para ver la copia");
  const w = window.open("", "_blank");
  if (w) w.document.write("<p style='font-family:sans-serif;padding:24px'>Cargando tu contrato…</p>");
  const { data, error } = await sb.from("contracts").select("*").eq("id", id).maybeSingle();
  if (error || !data) { if (w) w.close(); return toast("No se encontró el contrato"); }
  if (!MDTContrato.copia(data, w)) toast("Permite ventanas emergentes para ver la copia");
}
async function membresia(tipo) {
  const plus = tipo === "plus";

    <a class="btn block" href="${esc(MDTContrato.payUrl(plus ? PAY.plus : PAY.miembro, ct))}" target="_blank" rel="noopener">Pagar mi membresía</a>
    <button class="btn ghost block" data-copy="${ct.id}">Ver mi copia del contrato</button><button class="btn ghost block" data-close>Listo</button>`);
}

/* ---- Sheet y toast ---- */
function openSheet(html) {
  $("#layer").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#layer .scrim").addEventListener("click", (e) => { if (e.target.dataset.scrim != null) closeSheet(); });
  const f = $("#layer .sheet input"); if (f && !isIOS) f.focus();
}
function closeSheet(rerender = true) { $("#layer").innerHTML = ""; if (rerender) render(true); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#layer").innerHTML) closeSheet(); });
let tt;
function toast(m) {
  clearTimeout(tt); let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = m; tt = setTimeout(() => el.remove(), 2600);
}

/* ---- Arranque ---- */
(async function boot() {
  specialHash();
  render(false);
  if (!sb) { document.body.insertAdjacentHTML("afterbegin", '<div class="offline">Sin conexión: algunas cosas no van a funcionar hasta que vuelva el internet.</div>'); A.ready = true; render(true); return; }
  const isRecovery = /type=recovery/.test(location.hash + location.search);
  sb.auth.onAuthStateChange((ev, session) => {
    const before = A.user && A.user.id;
    A.user = session ? session.user : null;
    if (ev === "PASSWORD_RECOVERY") setTimeout(() => authSheet("newpass"), 0);
    if (ev === "INITIAL_SESSION") return;
    if ((A.user && A.user.id) !== before || ev === "SIGNED_OUT") setTimeout(() => { ADM.loaded = false; refresh(); }, 0);
  });
  const { data } = await sb.auth.getSession();
  A.user = data.session ? data.session.user : null;
  if (location.hash.includes("access_token") || isRecovery) history.replaceState(null, "", location.pathname + "#inicio");
  await refresh();
  if (!A.user && !PREF.seenWelcome && !isRecovery && !SPECIAL) {
    PREF.seenWelcome = true; savePref();
    openSheet(`
      <img src="assets/logo-dog.png" alt="" width="64" height="62" style="align-self:flex-start">
      <h3 class="d">¡Bienvenido a Moreno's!</h3>
      <p class="note" style="font-size:15px">Daycare, entrenamiento y clases para tu perro. Reserva, paga y mira cómo le va, todo desde aquí.</p>
      <button class="btn block" data-act="signup">Crear mi cuenta</button>
      <button class="btn ghost block" data-act="login">Ya tengo cuenta</button>
      <button class="linkbtn" data-close style="text-align:center">Mirar primero</button>`);
  }
  let lastRefresh = Date.now();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastRefresh > 20000) { lastRefresh = Date.now(); refresh(); } });
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>

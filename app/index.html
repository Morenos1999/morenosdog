*{box-sizing:border-box}

body{min-height:100vh;min-height:100dvh;background:

button{cursor:pointer}

.app{max-width:520px;margin:0 auto;padding-bottom:calc(120px + var(--safeB))}

.ticket .ttl{font-size:23px;margin:2px 0}
.ticket .sub{font-size:14px;color:var(--creamInk)}
.ticket .cut{border-top:2px dashed #D8CBC2;margin:0 16px}
.ticket .acts{display:flex;gap:8px;padding:14px 16px 16px}
.count{flex-shrink:0;width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#1E4247,#0F2528);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(4deg);color:#fff}
.count small{font-size:11px;font-weight:700;color:var(--muted)}
.count b{font-family:"Baloo 2";font-size:26px;line-height:.9;color:var(--peach)}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:0;padding:0 18px;font-weight:800;font-size:15px;text-decoration:none;background:var(--orange);color:var(--dark)}
.btn.dark{background:var(--bg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.3)}
.btn.teal{background:var(--teal);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.wa{background:#1F8A5B;color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:120px;border-radius:22px;padding:16px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;border:1px solid transparent}
.tile b{font-family:"Baloo 2";font-weight:800;font-size:20px;line-height:1.1;display:block}

.t-gold{background:var(--gold);color:var(--dark)} .t-gold span{color:#4A3A10}
.sticker{position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--dark);font-size:12px;font-weight:800;padding:4px 10px;border-radius:12px;transform:rotate(6deg);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:16px;color:var(--ink);text-decoration:none}
.row{display:flex;align-items:center;gap:14px}
.muted{color:var(--muted)}
.plus{position:relative;overflow:hidden;background:var(--orange);border:2px solid var(--gold);border-radius:24px;padding:18px;text-decoration:none;color:var(--dark);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 16px 36px rgba(222,106,62,.3)}

.plus .tag{position:relative;background:var(--bg);color:var(--gold);font-weight:800;font-size:16px;padding:8px 12px;border-radius:14px}
/* Reservar */
.tabs{position:relative;display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.13);padding:5px;border-radius:18px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:14px;font-size:13px;font-weight:800;background:transparent;color:var(--soft);padding:0 4px}
.tabs button[aria-pressed="true"]{background:var(--orange);color:var(--dark)}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left}
.opt[aria-pressed="true"]{background:rgba(240,132,85,.12);border:2px solid var(--orange);padding:15px;box-shadow:0 10px 28px rgba(222,106,62,.25)}
.opt b{font-family:"Baloo 2";font-weight:800;font-size:19px;line-height:1.15;display:block}

.price{flex-shrink:0;font-family:"Baloo 2";font-weight:800;font-size:20px;padding:4px 12px;border-radius:14px;color:var(--peach);background:rgba(255,255,255,.08)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:800;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink)}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex-shrink:0;width:58px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--ink)}

.day b{font-family:"Baloo 2";font-size:24px;line-height:1}
.day[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--dark)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.paybar{position:fixed;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));bottom:calc(96px + var(--safeB));background:var(--cream);color:var(--dark);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;z-index:20}

.cmd span{font-size:12px;color:var(--soft)}

.stat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stat small{font-size:11px;font-weight:700;color:var(--muted)}
.stat b{font-family:"Baloo 2";font-weight:800;font-size:18px;color:var(--peach)}
.rule{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rule:last-child{border-bottom:0}
.rule .ic{flex-shrink:0;width:36px;height:36px;border-radius:12px;background:rgba(240,132,85,.16);display:flex;align-items:center;justify-content:center;color:var(--peach)}
.rule b{display:block;font-size:15px}
.rule span{font-size:13px;color:var(--muted);line-height:1.45}
.polaroid{background:var(--cream);color:var(--dark);border-radius:8px;padding:10px 10px 14px;box-shadow:0 16px 34px rgba(0,0,0,.5);transform:rotate(-1.5deg)}
.polaroid .ph{height:150px;border-radius:4px;background:#CFE3E5;display:flex;align-items:center;justify-content:center;color:var(--teal)}

nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));bottom:calc(22px + var(--safeB));display:flex;gap:2px;background:rgba(8,22,25,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:30px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:30}

.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#163236,#0F2528);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + var(--safeB));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.7,.2,1)}

const DOW = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => iso(new Date());
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const nice = (s) => { const d = parse(s); return DOW[d.getDay()].charAt(0) + DOW[d.getDay()].slice(1).toLowerCase() + " " + d.getDate() + " " + MES[d.getMonth()]; };
const when = (ts) => { const d = new Date(ts), t = d.toLocaleTimeString("es-PR", { hour: "numeric", minute: "2-digit" }); return iso(d) === today() ? "Hoy " + t : nice(iso(d)) + " · " + t; };
function nextDays(n) {
  const out = [], d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1);
  while (out.length < n) { if (d.getDay() >= 1 && d.getDay() <= 5) out.push(iso(d)); d.setDate(d.getDate() + 1); }
  return out;
}
const daysUntil = (s) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parse(s) - t) / 864e5); };

async function loadAll() {
  if (!sb || !A.user) { Object.assign(A, { profile: null, admin: false, dogs: [], bookings: [], progress: {}, notes: [], updates: [], reports: {} }); return; }
  const uid = A.user.id;
  const [p, ad, d, b, gen] = await Promise.all([
    sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
    sb.rpc("is_admin"),
    sb.from("dogs").select("*").eq("owner_id", uid).order("created_at"),
    sb.from("bookings").select("*").eq("owner_id", uid).order("created_at", { ascending: false }),
    sb.from("updates").select("*").is("dog_id", null).order("created_at", { ascending: false }).limit(20)
  ]);
  A.profile = p.data || { id: uid, nombre: "", telefono: "" };
  A.admin = ad.data === true;
  A.dogs = d.data || [];
  A.bookings = b.data || [];
  const ids = A.dogs.map((x) => x.id);
  let updates = gen.data || [];
  A.progress = {}; A.notes = []; A.reports = {};
  if (ids.length) {
    const [pr, n, u, r] = await Promise.all([
      sb.from("dog_progress").select("*").in("dog_id", ids),
      sb.from("notes").select("*").in("dog_id", ids).order("created_at", { ascending: false }).limit(60),
      sb.from("updates").select("*").in("dog_id", ids).order("created_at", { ascending: false }).limit(60),
      sb.from("day_reports").select("*").in("dog_id", ids).eq("fecha", today())
    ]);
    (pr.data || []).forEach((x) => (A.progress[x.dog_id] = x.comandos || {}));
    A.notes = n.data || [];
    updates = updates.concat(u.data || []);
    (r.data || []).forEach((x) => (A.reports[x.dog_id] = x));
  }
  A.updates = updates.sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
}

async function loadAdmin() {

let refreshing = null, again = false;
async function refresh() {
  if (refreshing) { again = true; return refreshing; }
  refreshing = (async () => {
    do {
      again = false;
      try {
        await loadAll();
        const r = route();
        if (A.admin && r.name.startsWith("admin")) {
          await loadAdmin();
          if (r.name === "admin-perro") await loadAdminDog(r.arg);
        }
      } catch (e) { console.error(e); }
    } while (again);
    A.ready = true; refreshing = null; render(true);
  })();
  return refreshing;
}

function errMsg(e) {
  const m = String((e && e.message) || e || "");
  if (/invalid login/i.test(m)) return "Email o contraseña incorrectos.";
  if (/already registered|already exists/i.test(m)) return "Ese email ya tiene cuenta. Entra con tu contraseña.";
  if (/at least 6|password should/i.test(m)) return "La contraseña debe tener por lo menos 6 caracteres.";
  if (/email not confirmed/i.test(m)) return "Confirma tu email primero (revisa tu correo).";
  if (/rate limit|too many/i.test(m)) return "Demasiados intentos. Espera unos minutos y vuelve a intentar.";
  if (/invalid.*email|valid email/i.test(m)) return "Revisa que el email esté bien escrito.";
  if (/fetch|network/i.test(m)) return "No hay conexión. Revisa tu internet.";
  return "Algo salió mal: " + m;
}

/* ---- Fotos ---- */
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob((b) => (b ? res(b) : rej(new Error("No se pudo leer la foto"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer la foto. Prueba con otra.")); };
    img.src = url;
  });
}
async function upload(path, blob, type) {
  const { error } = await sb.storage.from("fotos").upload(path, blob, { contentType: type, upsert: true, cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}

async function publishUpdate(dogId, texto) {

    const folder = `updates/${dogId || "todos"}/${Date.now()}`;
    if (isVid) { const ext = (pendingMedia.name.split(".").pop() || "mp4").toLowerCase(); media_url = await upload(`${folder}.${ext}`, pendingMedia, pendingMedia.type || "video/mp4"); media_tipo = "video"; }
    else { media_url = await upload(`${folder}.jpg`, await resizeImage(pendingMedia, 1600), "image/jpeg"); media_tipo = "foto"; }
  }
  const { error } = await sb.from("updates").insert({ dog_id: dogId, texto, media_url, media_tipo });
  if (error) throw error;
  pendingMedia = null; toast("¡Publicado!");
  if (dogId) { await loadAdminDog(dogId); render(true); } else { const f = $("#upForm"); if (f) f.reset(); const l = $("#mediaLbl"); if (l) l.textContent = "Añadir foto o video"; await loadAll(); }
}

/* ---- Panel: acciones ---- */
async function adminBooking(id, estado, pay) {
  const patch = {}; if (estado) patch.estado = estado; if (pay != null && pay !== undefined) patch.pagado = pay === "1";
  const { error } = await sb.from("bookings").update(patch).eq("id", id);
  if (error) return toast(errMsg(error));
  toast(estado === "confirmada" ? "Reserva confirmada" : estado === "cancelada" ? "Reserva cancelada" : estado === "completada" ? "Marcada como completada" : "Pago actualizado");
  await loadAdmin(); render(true);
}
async function adminCmd(name) {
  const order = ["pendiente", "practicando", "dominado"], c = Object.assign({}, ADM.dog.comandos);
  c[name] = order[(order.indexOf(c[name] || "pendiente") + 1) % 3];
  ADM.dog.comandos = c; render(true);
  const { error } = await sb.from("dog_progress").upsert({ dog_id: ADM.dog.id, comandos: c, updated_at: new Date().toISOString() }, { onConflict: "dog_id" });
  if (error) toast(errMsg(error));
}

/* ---- Reservar: confirmar ---- */
async function confirmBooking() {
  const o = options()[R.opt];
  if (!isGroup() && !R.day) return toast("Escoge el día");
  if (needsTime() && !R.time) return toast("Escoge la hora");
  if (!A.user) { toast("Crea tu cuenta para reservar"); return authSheet("signup"); }
  const dog = curDog();
  if (!dog) { toast("Primero añade a tu perro"); return openSheet(`<h3 class="d">Añade a tu perro</h3>${dogForm(null).replace('id="dogForm" data-id=""', 'id="dogForm" data-id="" data-new="1"')}`); }
  const mod = R.tab === "train" ? MODS.find((m) => m[0] === R.mod)[1] : "";
  const titulo = R.tab === "train" ? `Paquete ${o.name} · ${mod}` : R.tab === "daycare" ? `Daycare · ${o.name}` : o.name;
  const payNow = R.plan === "dep" ? o.price / 2 : o.price;
  const methodName = { stripe: "Tarjeta o Klarna (Stripe)", ath: "ATH Móvil", cash: "Efectivo", check: "Cheque" }[R.method];
  const link = R.method === "stripe" && o.pay ? (R.plan === "dep" ? o.pay[1] : o.pay[0]) : "";
  const btn = $("#confirm"); if (btn) btn.disabled = true;
  const { error } = await sb.from("bookings").insert({ owner_id: A.user.id, dog_id: dog.id, servicio: R.tab, titulo, fecha: isGroup() ? null : R.day, hora: R.time || null, total: o.price, pagar_hoy: payNow, metodo: R.method, plan: R.plan });
  if (btn) btn.disabled = false;
  if (error) return toast(errMsg(error));
  const msg = [
    "Hola Moreno's, acabo de reservar en la app:",
    "Servicio: " + titulo,
    isGroup() ? "Fecha: apúntenme en la lista del próximo grupo" : "Día: " + nice(R.day) + (R.time ? " a las " + R.time : ""),
    "Pago: " + methodName + " · " + (R.plan === "dep" ? "Depósito 50% (" + money(payNow) + " de " + money(o.price) + ")" : "Completo (" + money(o.price) + ")"),
    "Cliente: " + ((A.profile && A.profile.nombre) || "-"),
    "Perro: " + dog.nombre + (dog.raza ? " (" + dog.raza + ")" : "")
  ].join("\n");
  refresh();
  openSheet(`
    <h3 class="d">¡Reserva enviada!</h3>
    <div class="sum"><b>${esc(titulo)}</b> · ${esc(dog.nombre)}<br>${isGroup() ? "Lista del próximo grupo" : nice(R.day) + (R.time ? " · " + esc(R.time) : "")}<br>${R.plan === "dep" ? "Depósito hoy: " + money(payNow) + " de " + money(o.price) : "Total: " + money(o.price)} · ${methodName}</div>
    <p class="note">Hector la revisa y la confirma. Vas a ver el cambio en <b style="color:var(--ink)">Mi perro</b>.</p>
    <div class="step"><span class="n">1</span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><b>Paga para apartar tu espacio</b>${link ? `<a class="btn block" href="${link}" target="_blank" rel="noopener">Pagar ${money(payNow)} ahora</a><span class="note">Pagas seguro con Stripe. Klarna te deja pagar en cuotas.</span>` : `<span class="note">Te enviamos las instrucciones de pago por WhatsApp${R.method === "ath" ? " para ATH Móvil" : ""}.</span>`}</div></div>
    <div class="step"><span class="n">2</span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><b>¿Quieres avisarle ya?</b><a class="btn wa block" href="${waLink(msg)}" target="_blank" rel="noopener">${ic("wa", 20)} Avisar por WhatsApp</a></div></div>
    <button class="btn ghost block" data-close>Listo</button>`);
}

/* ---- Sheet y toast ---- */
function openSheet(html) {
  $("#layer").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#layer .scrim").addEventListener("click", (e) => { if (e.target.dataset.scrim != null) closeSheet(); });
  const f = $("#layer .sheet input"); if (f && !isIOS) f.focus();
}
function closeSheet(rerender = true) { $("#layer").innerHTML = ""; if (rerender) render(true); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#layer").innerHTML) closeSheet(); });
let tt;
function toast(m) {
  clearTimeout(tt); let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = m; tt = setTimeout(() => el.remove(), 2600);
}

/* ---- Arranque ---- */
(async function boot() {
  render(false);
  if (!sb) { document.body.insertAdjacentHTML("afterbegin", '<div class="offline">Sin conexión: algunas cosas no van a funcionar hasta que vuelva el internet.</div>'); A.ready = true; render(true); return; }
  const isRecovery = /type=recovery/.test(location.hash + location.search);
  sb.auth.onAuthStateChange((ev, session) => {
    const before = A.user && A.user.id;
    A.user = session ? session.user : null;
    if (ev === "PASSWORD_RECOVERY") setTimeout(() => authSheet("newpass"), 0);
    if (ev === "INITIAL_SESSION") return;
    if ((A.user && A.user.id) !== before || ev === "SIGNED_OUT") setTimeout(() => { ADM.loaded = false; refresh(); }, 0);
  });
  const { data } = await sb.auth.getSession();
  A.user = data.session ? data.session.user : null;
  if (location.hash.includes("access_token") || isRecovery) history.replaceState(null, "", location.pathname + "#inicio");
  await refresh();
  if (!A.user && !PREF.seenWelcome && !isRecovery) {
    PREF.seenWelcome = true; savePref();
    openSheet(`
      <img src="assets/logo-dog.png" alt="" width="64" height="62" style="align-self:flex-start">
      <h3 class="d">¡Bienvenido a Moreno's!</h3>
      <p class="note" style="font-size:15px">Daycare, entrenamiento y clases para tu perro. Reserva, paga y mira cómo le va, todo desde aquí.</p>
      <button class="btn block" data-act="signup">Crear mi cuenta</button>
      <button class="btn ghost block" data-act="login">Ya tengo cuenta</button>
      <button class="linkbtn" data-close style="text-align:center">Mirar primero</button>`);
  }
  let lastRefresh = Date.now();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastRefresh > 20000) { lastRefresh = Date.now(); refresh(); } });
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
